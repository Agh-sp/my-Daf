map $http_upgrade $openfront_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream middleeastdefense_workers {
    random;
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
}

map $openfront_worker $openfront_worker_port {
    default 3001;
    0       3001;
    1       3002;
}

server {
    listen 80;
    server_name middleeastdefense.ir www.middleeastdefense.ir;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name middleeastdefense.ir www.middleeastdefense.ir;

    ssl_certificate /etc/letsencrypt/live/middleeastdefense.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/middleeastdefense.ir/privkey.pem;

    location ~ ^/w(?<openfront_worker>[0-9]+)(?<openfront_path>/.*)?$ {
        proxy_pass http://127.0.0.1:$openfront_worker_port$openfront_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openfront_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /api/create_game {
        proxy_pass http://middleeastdefense_workers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/adminbot/create_game {
        proxy_pass http://middleeastdefense_workers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/adminbot/create_pool {
        proxy_pass http://middleeastdefense_workers;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $openfront_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
